services:
  quest-log-dev:
    # #165: see docker-compose.yml. Its own image name, so dev builds never touch prod's tags.
    image: "${QUESTLOG_IMAGE:-quest-log-dev}:${QUESTLOG_TAG:-local}"
    build:
      context: .
      args:
        BUILD_SHA: "${BUILD_SHA:-}"
        BUILD_DATE: "${BUILD_DATE:-}"
    container_name: quest-log-dev
    restart: unless-stopped
    # #171: the same shape as prod -- its own LAN address, with this install's values in .env
    # (see .env.example). To run the app on a laptop without Docker, `node app/server.js` with
    # QUEST_LOG_ENV=dev serves http://localhost:4243.
    networks:
      questlog-lan:
        ipv4_address: "${QUESTLOG_IP:?set QUESTLOG_IP in .env to this dev install's free LAN address (see .env.example)}"
    volumes:
      - "${QUESTLOG_DATA_DIR:-./data}:/app/data"
      - "${QUESTLOG_CERTS_DIR:-./certs}:/app/certs"
    environment:
      - PORT=${QUESTLOG_PORT:-80}
      - DISABLE_TLS=1
      - DATA_PATH=/app/data/state.dev.json
      - QUEST_LOG_ENV=dev
      - CERT_PATH=/app/certs/cert.pem
      - KEY_PATH=/app/certs/key.pem
      - CERT_SAN_DNS=${QUESTLOG_HOSTNAME:-questlog-dev.local}
      - CERT_SAN_IP=${QUESTLOG_IP}

networks:
  questlog-lan:
    external: true
    name: "${QUESTLOG_LAN_NETWORK:-questlog-lan}"
