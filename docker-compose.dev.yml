services:
  quest-log-dev:
    # #165: see docker-compose.yml. Its own image name, so dev builds never touch prod's tags.
    image: "${QUESTLOG_IMAGE:-quest-log-dev}:${QUESTLOG_TAG:-local}"
    build:
      context: .
      args:
        BUILD_SHA: "${BUILD_SHA:-}"
        BUILD_DATE: "${BUILD_DATE:-}"
    container_name: quest-log-dev
    restart: unless-stopped
    ports:
      - "4243:4243"
    volumes:
      - ./data:/app/data
      - ./certs:/app/certs
    environment:
      - PORT=4243
      - DISABLE_TLS=1
      - DATA_PATH=/app/data/state.dev.json
      - QUEST_LOG_ENV=dev
      - CERT_PATH=/app/certs/cert.pem
      - KEY_PATH=/app/certs/key.pem
      - CERT_SAN_DNS=questlog-dev.local
      - CERT_SAN_IP=127.0.0.1
