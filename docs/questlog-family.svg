  <!-- ===================== SECTION 04 (NEW) ===================== -->
  <text x="50" y="2078" font-size="20" font-weight="bold" fill="#d9a441">04 — Checkpoint hooks (Claude Code session, not this process)</text>
  <text x="50" y="2104" font-size="14" fill="#6fae8c">~/.claude/settings.json on each machine. These fire inside a Claude Code session and inject a text</text>
  <text x="50" y="2123" font-size="14" fill="#6fae8c">nudge — they never call the MCP server directly. Portable copy tracked in questtracker-skill.md.</text>

  <text x="50" y="2152" font-size="12" fill="#8fd6ab">PostToolUse:</text>
  <text x="180" y="2152" font-size="12" fill="#5fa27e">git commit/push · gh pr create · gh issue create/close/comment · Write|Edit on CLAUDE.md/memory</text>
  <text x="50" y="2172" font-size="12" fill="#8fd6ab">SessionStart:</text>
  <text x="180" y="2172" font-size="12" fill="#5fa27e">stale-idea nudge · artifact-staleness nudge (#47) · attention-flag nudge (#60)</text>
</svg>
